name: iOS Bulut Derleme (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Export iOS IPA
    runs-on: macos-14

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Xcode Ortamını Yapılandır (v15.4)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Node.js Ortamını Kur (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Birim Testleri Doğrula
        run: npm test

      - name: Web Uygulamasını Derle ve iOS Projesini Senkronize Et
        run: npm run ios:sync

      - name: Xcode ile iOS Uygulamasını Derle (Release)
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build

      - name: IPA Kurulum Paketini Oluştur (.ipa / Payload)
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r "Duty Dijital Ayna.ipa" Payload
          cp "Duty Dijital Ayna.ipa" DijitalAyna-iOS-Unsigned.ipa

      - name: IPA Dosyasını GitHub Artifacts Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Duty-Dijital-Ayna-iOS-Unsigned
          path: "ios/App/build/Build/Products/Release-iphoneos/Duty Dijital Ayna.ipa"
          retention-days: 14
          if-no-files-found: error
